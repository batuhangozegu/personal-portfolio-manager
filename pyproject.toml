[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-portfolio-manager"
version = "0.1.0"
description = "Rule-based, explainable portfolio allocation and risk review (decision support only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ppm = "personal_portfolio_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
